# Noise suppression (RNNoise) after the echo canceller, as the default microphone
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Microphone (echo cancelled, denoised)"
            media.name = "Microphone (echo cancelled, denoised)"
            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = rnnoise
                        plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                        label = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)" = 0.0
                            "VAD Grace Period (ms)" = 0
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
            }
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name = "noise-suppression-capture"
                node.passive = true
                target.object = "echo-cancel-source"
            }
            playback.props = {
                node.name = "noise-suppression-source"
                media.class = Audio/Source
                priority.session = 2200
            }
        }
    }
]
