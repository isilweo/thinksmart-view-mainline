# Samsung S5KC505A (Lenovo ThinkSmart View)
#
# Black level 64 at 10 bits. Colour matrices fitted on a Datacolor
# SpyderCheckr 24 under an Elgato Key Light at 2900, 4000, 5000 and 6500 K
# (flat-fielded with the grey back of the chart); ct keys are the values the
# soft ISP's estimateCCT() reports for those lights on this sensor.
# Full-strength matrices, median CIE76 error after correction 3.9-5.8.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 3473
          ccm: [ 2.223, -0.861, -0.363, -0.531, 1.774, -0.243, -0.060, -0.875, 1.934 ]
        - ct: 4406
          ccm: [ 2.282, -1.069, -0.213, -0.458, 1.785, -0.327, -0.058, -0.585, 1.642 ]
        - ct: 4763
          ccm: [ 2.316, -1.126, -0.190, -0.439, 1.789, -0.350, -0.058, -0.541, 1.600 ]
        - ct: 5368
          ccm: [ 2.357, -1.205, -0.153, -0.412, 1.796, -0.384, -0.064, -0.491, 1.555 ]
  - Adjust:
  - Agc:
...
