# Echo cancellation (WebRTC) as the default microphone and speaker
context.modules = [
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = false
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.gain_control = true
                webrtc.extended_filter = true
                webrtc.delay_agnostic = true
            }
            capture.props = { node.name = "echo-cancel-capture" }
            source.props = {
                node.name = "echo-cancel-source"
                node.description = "Microphone (echo cancelled)"
                priority.session = 2100
            }
            sink.props = {
                node.name = "echo-cancel-sink"
                node.description = "Speaker (echo cancelled)"
                priority.session = 2100
            }
            playback.props = { node.name = "echo-cancel-playback" }
        }
    }
]
